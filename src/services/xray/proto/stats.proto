syntax = "proto3";

package xray.app.stats.command;

// Minimal subset of Xray stats command API for TunPilot integration.
// Only includes QueryStats — used for traffic collection and health check.

message Stat {
  string name = 1;
  int64 value = 2;
}

message QueryStatsRequest {
  string pattern = 1;
  bool reset = 2;
}

message QueryStatsResponse {
  repeated Stat stat = 1;
}

service StatsService {
  rpc QueryStats(QueryStatsRequest) returns (QueryStatsResponse) {}
}
